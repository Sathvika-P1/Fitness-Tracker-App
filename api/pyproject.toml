[project]
name = "ftp-signup-api"
version = "0.1.0"
description = "Fitness Tracker signup/session API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
