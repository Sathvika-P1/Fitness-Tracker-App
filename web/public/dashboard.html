<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Fitness Tracker</title>
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/prototype-utils.css">
<style>
  .empty-state {
    text-align: center;
    padding: var(--space-4) var(--space-3);
  }
  .empty-illustration {
    width: 72px;
    height: 72px;
    border-radius: var(--radius-lg);
    background: var(--color-surface);
    border: var(--border-width-sm) solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto var(--space-3);
  }
</style>
</head>
<body>

<div class="top-app-bar">
  <div>
    <h1 class="text-bold" id="welcome-name" style="margin:0;font-size:inherit">Welcome</h1>
    <div class="text-sm text-muted" id="welcome-email"></div>
  </div>
  <div class="avatar-menu" data-avatar-menu>
    <button class="avatar-menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Account menu" data-avatar-trigger>
      <div class="avatar" id="avatar-initials" aria-hidden="true"></div>
    </button>
    <div class="avatar-menu-dropdown" role="menu" hidden data-avatar-dropdown>
      <a class="avatar-menu-item" role="menuitem" href="profile.html">View profile</a>
      <button class="avatar-menu-item danger" role="menuitem" type="button" id="logout-button">Logout</button>
    </div>
  </div>
</div>
<div class="empty-state">
  <div class="empty-illustration" aria-hidden="true">🏃</div>
  <h2 class="text-lg text-bold">No workouts logged yet</h2>
  <p class="text-muted" style="max-width: 320px; margin: var(--space-2) auto 0;">Your account is ready. Log your first workout to start tracking progress.</p>
  <a class="btn btn-primary" style="margin-top: var(--space-3); min-height:44px;" href="workout-entry.html">Log a workout</a>
</div>
<div class="bottom-tabs">
  <div class="bottom-tab active">Today</div>
  <div class="bottom-tab" role="button" aria-disabled="true">Log</div>
  <div class="bottom-tab" role="button" aria-disabled="true">Progress</div>
  <a class="bottom-tab" href="profile.html">Profile</a>
</div>

<script type="module" src="/avatar-menu.js"></script>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
