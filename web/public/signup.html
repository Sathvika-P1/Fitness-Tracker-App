<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Fitness Tracker</title>
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/prototype-utils.css">
<style>
  html, body { height: 100%; }
  body { min-height: 100dvh; }
  .auth-shell {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4) var(--space-3);
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
  }
  .field { margin-bottom: var(--space-3); }
  .field-error-text {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    color: var(--color-danger);
    font-size: var(--font-size-sm);
    margin-top: var(--space-1);
  }
  .input.has-error {
    border-color: var(--color-danger);
    border-width: var(--border-width-md);
  }
  .helper-text {
    color: var(--color-muted);
    font-size: var(--font-size-sm);
    margin-top: var(--space-1);
  }
  .btn-block {
    width: 100%;
    min-height: 44px;
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    pointer-events: none;
  }
  .banner {
    display: flex;
    gap: var(--space-2);
    align-items: flex-start;
    background: var(--color-bg);
    border: var(--border-width-md) solid var(--color-danger);
    border-radius: var(--radius-md);
    padding: var(--space-3);
    margin-bottom: var(--space-3);
  }
  .banner[hidden] { display: none; }
  .banner-icon { color: var(--color-danger); font-weight: var(--font-weight-bold); flex-shrink: 0; }
  .banner-title { color: var(--color-danger); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); }
  .banner-body { color: var(--color-fg); font-size: var(--font-size-sm); }
  .link-inline {
    color: var(--color-primary);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }
  .center-note {
    text-align: center;
    margin-top: var(--space-3);
    font-size: var(--font-size-sm);
    color: var(--color-muted);
  }
</style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card card">
    <h1 class="card-title">Create your account</h1>
    <p class="card-body text-muted">Track your workouts, progress, and goals — just for you.</p>

    <div class="banner" id="duplicate-banner" role="alert" hidden>
      <span class="banner-icon" aria-hidden="true">⚠</span>
      <div>
        <div class="banner-title">That email is already registered</div>
        <div class="banner-body" id="duplicate-banner-body"></div>
      </div>
    </div>

    <form id="signup-form" novalidate style="margin-top: var(--space-3);">
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com">
        <p class="field-error-text" id="email-error" style="display:none;" role="alert"></p>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <p class="helper-text">Minimum 8 characters.</p>
        <p class="field-error-text" id="password-error" style="display:none;" role="alert"></p>
      </div>
      <div class="field">
        <label class="label" for="displayname">Display name</label>
        <input class="input" id="displayname" type="text" autocomplete="name" placeholder="How you'll appear in the app">
        <p class="field-error-text" id="displayname-error" style="display:none;" role="alert"></p>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
    </form>
    <p class="center-note">Already have an account? <button class="link-inline" type="button">Sign in</button></p>
  </div>
</div>

<script type="module" src="/signup.js"></script>
</body>
</html>
