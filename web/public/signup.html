<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Fitness Tracker</title>
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/prototype-utils.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card card">
    <h1 class="card-title">Create your account</h1>
    <p class="card-body text-muted">Track your workouts, progress, and goals — just for you.</p>

    <div class="banner" id="duplicate-banner" role="alert" hidden>
      <span class="banner-icon" aria-hidden="true">⚠</span>
      <div>
        <div class="banner-title">That email is already registered</div>
        <div class="banner-body" id="duplicate-banner-body"></div>
      </div>
    </div>

    <form id="signup-form" novalidate style="margin-top: var(--space-3);">
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com">
        <p class="field-error-text" id="email-error" role="alert" hidden></p>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <p class="helper-text">Minimum 8 characters.</p>
        <p class="field-error-text" id="password-error" role="alert" hidden></p>
      </div>
      <div class="field">
        <label class="label" for="displayname">Display name</label>
        <input class="input" id="displayname" type="text" autocomplete="name" placeholder="How you'll appear in the app">
        <p class="field-error-text" id="displayname-error" role="alert" hidden></p>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
    </form>
    <p class="center-note">Already have an account? <button class="link-inline" type="button" onclick="window.location.href='login.html'">Log in</button></p>
  </div>
</div>

<script type="module" src="/signup.js"></script>
</body>
</html>
