<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/prototype-utils.css">
<style>
  .welcome-shell {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4) var(--space-3);
  }
  .welcome-card {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  .welcome-logo {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-lg);
    background: var(--color-primary);
    color: var(--color-on-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto var(--space-3);
  }
  .welcome-options {
    display: flex;
    gap: var(--space-3);
    margin-top: var(--space-4);
  }
  .welcome-options .btn {
    flex: 1 1 0;
    min-height: 44px;
  }
  .redirect-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 100dvh;
  }
  .spinner {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: var(--border-width-md) solid var(--color-border);
    border-top-color: var(--color-primary);
    animation: spin 0.8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="welcome-checking" class="redirect-note">
  <div class="spinner" aria-hidden="true"></div>
  <span class="text-muted" role="status">Checking your session…</span>
</div>

<div id="welcome-content" class="welcome-shell" hidden>
  <div class="welcome-card">
    <div class="welcome-logo" aria-hidden="true">🏋️</div>
    <h1 class="text-lg text-bold" style="margin:0;">Fitness Tracker</h1>
    <p class="text-muted" style="margin-top: var(--space-3);">
      Fitness Tracker helps you log workouts, track your progress toward a goal, and keep your
      body stats in one place — so you always know how today's effort fits your bigger picture.
    </p>
    <div class="welcome-options">
      <a class="btn btn-primary" id="welcome-login-btn" href="login.html">Log in</a>
      <a class="btn btn-secondary" id="welcome-signup-btn" href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<script type="module" src="/index.js"></script>
</body>
</html>
